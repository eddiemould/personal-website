<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation // Eddie Mould</title>

  <script>
    (function() {
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.classList.add(theme);
        }
      } catch (e) {}
    })();
  </script>
  
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet"> 
</head>

<body>
  <div id="header-placeholder"></div>
  
  <main class="main-column">
    <h1 id="page-header">Animation</h1>

    <div class="editing-panel">
      <div class="editing-poster">
        <img src="./images/animation/this-is-the-life.jpg" alt="">
        <div class="editing-text">
          <h4>This is The Life? (2024)</h4>
          <p>A surreal job interview takes place at a doorknob company, as different animation styles converge around them.</p>
          <p>Directors<br>Maya Gan<br><a href="https://tagliariniandrea.com/" target="_blank">Andrea Tagliarini</a></p>
          <p>Production<br>Bournemouth Film School</p>
          <p>Runtime<br>3min</p>
        </div>
      </div>
    </div>

  </main>
  
  <div id="footer-placeholder"></div>
  <div id="image-overlay">
    <img id="overlay-image" src="" alt="">
  </div>
</body>
  <script src="script.js"></script>
</html>
