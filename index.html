<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eddie Mould</title>

  <script>
    (function() {
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.classList.add(theme);
        }
      } catch (e) {}
    })();
  </script>
  
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet"> 
</head>

<body>
  <div id="header-placeholder"></div>
  
  <main class="main-column general-text-styles">
    
    <video autoplay loop muted playsinline id="homepage-video">
      <source src="/video/website-landing-video.mp4" type="video/mp4">
      Your browser does not support video.
    </video>

  </main>
  
  <div id="footer-placeholder"></div>
  <div id="image-overlay">
    <img id="overlay-image" src="" alt="">
  </div>
</body>
  <script src="script.js"></script>
</html>
